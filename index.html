```html
<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>JANコード読み取り</title>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

h2 {
  margin: 10px 0 15px;
}

.message {
  font-size: 14px;
  line-height: 1.6;
  margin: 15px 0;
}

.scanButton {
  display: block;
  width: 100%;
  max-width: 500px;
  margin: 20px auto;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #d97b5f;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.copyButton {
  background: #6689a5;
  display: none;
}

.closeButton {
  background: #555;
  font-size: 15px;
}

#preview {
  width: 100%;
  max-width: 500px;
  max-height: 60vh;
  object-fit: contain;
  margin: 10px auto;
  border-radius: 12px;
  display: none;
}

#cameraInput {
  display: none;
}

#result {
  display: none;
  margin: 20px auto;
  padding: 15px;
  max-width: 500px;
  background: #222;
  border-radius: 12px;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 2px;
  user-select: text;
  -webkit-user-select: text;
}

</style>

</head>

<body>

<h2>📷 JANコード読み取り</h2>

<div id="message" class="message">
「カメラを起動」を押してください。
</div>

<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
>

<button
  class="scanButton"
  onclick="openCamera()"
>
📷 カメラを起動
</button>

<img
  id="preview"
>

<div id="result"></div>

<button
  id="copyButton"
  class="scanButton copyButton"
  onclick="copyJAN()"
>
📋 JANをコピー
</button>

<button
  class="scanButton closeButton"
  onclick="closeCamera()"
>
ゲーム管理へ戻る
</button>


<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

<script>

const input =
  document.getElementById("cameraInput");

const message =
  document.getElementById("message");

const preview =
  document.getElementById("preview");

const resultBox =
  document.getElementById("result");

const copyButton =
  document.getElementById("copyButton");


let currentJAN = "";


/*
 * カメラ起動
 */
function openCamera() {

  message.textContent =
    "カメラを起動しています…";

  input.click();

}


/*
 * 写真取得
 */
input.addEventListener(
  "change",
  async function(event) {

    const file =
      event.target.files &&
      event.target.files[0];

    if (!file) {

      message.textContent =
        "カメラがキャンセルされました。";

      return;

    }

    message.textContent =
      "JANコードを読み取っています…";


    const url =
      URL.createObjectURL(file);


    preview.src = url;
    preview.style.display = "block";


    try {

      if (!window.ZXingBrowser) {

        throw new Error(
          "バーコード読み取り機能を読み込めませんでした。"
        );

      }


      const reader =
        new ZXingBrowser.BrowserMultiFormatReader();


      const result =
        await reader.decodeFromImageUrl(url);


      if (
        result &&
        result.text
      ) {

        const jan =
          String(result.text)
            .replace(/\D/g, "");


        if (jan.length === 13) {

          currentJAN = jan;


          /*
           * JAN表示
           */
          resultBox.textContent =
            jan;

          resultBox.style.display =
            "block";


          /*
           * コピーするボタンを表示
           */
          copyButton.style.display =
            "block";


          message.textContent =
            "JANを読み取りました。";


          return;

        }

      }


      message.textContent =
        "JANコードを読み取れませんでした。もう一度撮影してください。";


    } catch (error) {

      console.error(error);

      message.textContent =
        "JANコードを読み取れませんでした。";

    } finally {

      URL.revokeObjectURL(url);

    }

  }
);


/*
 * JANコピー
 */
async function copyJAN() {

  if (!currentJAN) {

    message.textContent =
      "コピーするJANコードがありません。";

    return;

  }


  try {

    await navigator.clipboard.writeText(
      currentJAN
    );


    message.textContent =
      "JANコードをコピーしました。ゲーム管理画面のJAN欄に貼り付けてください。";


  } catch (error) {

    /*
     * コピー機能の予備処理
     */
    const textarea =
      document.createElement("textarea");

    textarea.value =
      currentJAN;

    textarea.style.position =
      "fixed";

    textarea.style.left =
      "-9999px";

    document.body.appendChild(
      textarea
    );

    textarea.focus();

    textarea.select();

    document.execCommand(
      "copy"
    );

    document.body.removeChild(
      textarea
    );


    message.textContent =
      "JANコードをコピーしました。ゲーム管理画面のJAN欄に貼り付けてください。";

  }

}


/*
 * ゲーム管理画面へ戻る
 */
function closeCamera() {

  window.location.href =
    "https://script.google.com/macros/s/AKfycbzR1DLFRioq4Sh9sBRRPqOSNaPkVRuofzY4H9r9uxnLV4P_B_tw9wctWRoT-DlGWKMr6w/exec";

}

</script>

</body>
</html>
```
