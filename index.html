<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>JANコード読み取りテスト</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

h2 {
  margin: 10px 0 15px;
}

video {
  width: 100%;
  max-width: 600px;
  background: #000;
  border-radius: 12px;
}

.message {
  margin: 15px 0;
  line-height: 1.6;
}

button {
  width: 100%;
  max-width: 600px;
  padding: 15px;
  margin-top: 10px;
  border: 0;
  border-radius: 12px;
  background: #d97b5f;
  color: white;
  font-size: 17px;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>📷 JANコード読み取りテスト</h2>

<video id="video" autoplay playsinline muted></video>

<div id="message" class="message">
「カメラを起動」を押してください。
</div>

<button onclick="startCamera()">
📷 カメラを起動
</button>

<button onclick="stopCamera()" style="background:#555">
カメラを閉じる
</button>

<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

<script>

let stream = null;
let reader = null;
let controls = null;


/* =========================
   カメラ起動
========================= */

async function startCamera() {

  const video =
    document.getElementById("video");

  const message =
    document.getElementById("message");

  try {

    message.textContent =
      "カメラを起動しています…";

    /*
     * iPhoneの背面カメラを指定
     */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject = stream;

    await video.play();


    message.textContent =
      "カメラが起動しました。JANバーコードを映してください。";


    /*
     * ZXing確認
     */

    if (!window.ZXingBrowser) {

      message.textContent =
        "バーコード読み取り機能の読み込みに失敗しました。";

      return;

    }


    startScanner();


  } catch (error) {

    console.error(error);

    message.textContent =
      "カメラを起動できませんでした。";

  }

}


/* =========================
   JAN読み取り
========================= */

function startScanner() {

  const video =
    document.getElementById("video");

  const message =
    document.getElementById("message");


  reader =
    new ZXingBrowser.BrowserMultiFormatReader();


  message.textContent =
    "JANバーコードをカメラに映してください。";


  /*
   * カメラ映像からリアルタイム読み取り
   */

  controls =
    reader.decodeFromVideoElement(
      video,

      function(result, error) {

        if (!result) {
          return;
        }


        const jan =
          String(result.text || "")
            .replace(/\D/g, "");


        /*
         * JAN-13だけ採用
         */

        if (!/^\d{13}$/.test(jan)) {
          return;
        }


        message.textContent =
          "✅ JANを読み取りました！\n" +
          jan;


        /*
         * 読み取り成功
         */

        stopCamera();

      }

    );

}


/* =========================
   カメラ停止
========================= */

function stopCamera() {

  if (controls) {

    try {

      controls.stop();

    } catch (e) {}

    controls = null;

  }


  if (reader) {

    try {

      reader.reset();

    } catch (e) {}

    reader = null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    stream = null;

  }


  document.getElementById("video").srcObject = null;

}

</script>

</body>
</html>
