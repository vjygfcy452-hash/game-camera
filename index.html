<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<title>JANコード読み取り</title>
<style>
body {
  margin: 0;
  padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}
h2 {
  margin: 10px 0 15px;
}
.message {
  font-size: 14px;
  line-height: 1.6;
  margin: 15px 0;
}
.scanButton {
  display: block;
  width: 100%;
  max-width: 500px;
  margin: 20px auto;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #d97b5f;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
.closeButton {
  background: #555;
  font-size: 15px;
}
#preview {
  width: 100%;
  max-width: 500px;
  max-height: 60vh;
  object-fit: contain;
  margin: 10px auto;
  border-radius: 12px;
  display: none;
}
#cameraInput {
  display: none;
}
</style>
</head>
<body>
<h2>📷 JANコード読み取り</h2>
<div id="message" class="message">
「カメラを起動」を押してください。
</div>
<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
>
<button
  class="scanButton"
  onclick="openCamera()"
>
📷 カメラを起動
</button>
<img
  id="preview"
>
<button
  class="scanButton closeButton"
  onclick="closeCamera()"
>
カメラを閉じる
</button>
<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
<script>
const input =
  document.getElementById("cameraInput");
const message =
  document.getElementById("message");
const preview =
  document.getElementById("preview");
/*
 * Apps Script URL
 */
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzR1DLFRioq4Sh9sBRRPqOSNaPkVRuofzY4H9r9uxnLV4P_B_tw9wctWRoT-DlGWKMr6w/exec";
/*
 * カメラ起動
 */
function openCamera() {
  message.textContent =
    "カメラを起動しています…";
  input.click();
}
/*
 * 写真取得
 */
input.addEventListener(
  "change",
  async function(event) {
    const file =
      event.target.files &&
      event.target.files[0];
    if (!file) {
      message.textContent =
        "カメラがキャンセルされました。";
      return;
    }
    message.textContent =
      "JANコードを読み取っています…";
    const url =
      URL.createObjectURL(file);
    preview.src = url;
    preview.style.display = "block";
    try {
      if (!window.ZXingBrowser) {
        throw new Error(
          "バーコード読み取り機能を読み込めませんでした。"
        );
      }
      const reader =
        new ZXingBrowser.BrowserMultiFormatReader();
      const result =
        await reader.decodeFromImageUrl(url);
      if (
        result &&
        result.text
      ) {
        const jan =
          String(result.text)
            .replace(/\D/g, "");
        if (jan.length === 13) {
          message.textContent =
            "JANを読み取りました。";
          /*
           * Apps ScriptへJANを送信
           */
          fetch(
            APPS_SCRIPT_URL +
            "?action=receiveJAN&jan=" +
            encodeURIComponent(jan),
            {
              method: "GET",
              mode: "no-cors"
            }
          );
          /*
           * ゲーム管理画面へ戻る
           */
          setTimeout(
            function() {
              window.location.href =
                APPS_SCRIPT_URL;
            },
            1000
          );
          return;
        }
      }
      message.textContent =
        "JANコードを読み取れませんでした。もう一度撮影してください。";
    } catch (error) {
      console.error(error);
      message.textContent =
        "JANコードを読み取れませんでした。";
    } finally {
      URL.revokeObjectURL(url);
    }
  }
);
/*
 * 閉じる
 */
function closeCamera() {
  window.history.back();
}
</script>
</body>
</html>
