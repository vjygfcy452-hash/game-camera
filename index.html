<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>JANコード読み取り</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #111;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  text-align: center;
}

h2 {
  margin: 18px 10px 10px;
}

#message {
  min-height: 45px;
  padding: 0 15px;
  font-size: 16px;
  line-height: 1.5;
}

#cameraArea {
  position: relative;
  width: 100%;
  max-width: 800px;
  margin: 15px auto 0;
  background: #000;
  overflow: hidden;
}

#video {
  display: block;
  width: 100%;
  height: auto;
  background: #000;
}

#scanFrame {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 35%;
  height: 30%;
  border: 3px solid #00ff66;
  border-radius: 8px;
  pointer-events: none;
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25);
}

#scanLabel {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 12px;
  font-size: 15px;
  font-weight: bold;
  text-shadow: 0 2px 4px #000;
}

button {
  display: block;
  width: calc(100% - 30px);
  max-width: 700px;
  margin: 18px auto;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #6689a5;
  color: #fff;
  font-size: 17px;
  font-weight: bold;
}

#stopButton {
  background: #555;
}

#copyButton {
  background: #d97b5f;
}

#backButton {
  background: #555;
}

#result {
  margin: 20px 15px;
  padding: 15px;
  background: #222;
  border-radius: 10px;
  font-size: 20px;
  font-weight: bold;
  user-select: text;
  -webkit-user-select: text;
}

.hidden {
  display: none;
}

</style>

</head>

<body>

<h2>📷 JANコード読み取り</h2>

<div id="message">
「カメラを起動」を押してください。
</div>

<button
  id="startButton"
  onclick="startScanner()"
>
📷 カメラを起動
</button>

<div
  id="cameraArea"
  class="hidden"
>

  <video
    id="video"
    autoplay
    muted
    playsinline
  ></video>

  <div id="scanFrame"></div>

  <div id="scanLabel">
    JANコードを緑の枠に合わせてください
  </div>

</div>

<button
  id="stopButton"
  class="hidden"
  onclick="stopScanner()"
>
カメラを停止
</button>

<div
  id="result"
  class="hidden"
></div>

<button
  id="copyButton"
  class="hidden"
  onclick="copyJAN()"
>
📋 JANコードをコピー
</button>

<button
  id="backButton"
  onclick="goBackToGameManager()"
>
ゲーム管理へ戻る
</button>


<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>


<script>

let codeReader = null;
let controls = null;
let scanning = false;
let currentJAN = "";


/*
 * カメラ開始
 */
async function startScanner() {

  const message =
    document.getElementById("message");

  const cameraArea =
    document.getElementById("cameraArea");

  const startButton =
    document.getElementById("startButton");

  const stopButton =
    document.getElementById("stopButton");

  const resultBox =
    document.getElementById("result");

  const copyButton =
    document.getElementById("copyButton");

  const video =
    document.getElementById("video");


  resultBox.classList.add("hidden");

  copyButton.classList.add("hidden");

  currentJAN = "";


  startButton.classList.add("hidden");

  stopButton.classList.remove("hidden");

  cameraArea.classList.remove("hidden");


  if (!window.ZXingBrowser) {

    message.textContent =
      "ZXingの読み込みに失敗しました。";

    return;

  }


  try {

    message.textContent =
      "カメラを起動しています…";


    /*
     * JAN読み取りの基準版と同じ方式
     *
     * deviceIdを指定しない。
     * facingMode: environment により
     * 背面カメラを優先。
     */
    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader();


    scanning = true;


    controls =
      await codeReader.decodeFromVideoDevice(

        undefined,

        video,

        function(result, error) {

          if (!scanning) {
            return;
          }


          if (
            result &&
            result.text
          ) {

            const raw =
              String(result.text);


            const jan =
              raw.replace(/\D/g, "");


            if (
              /^\d{13}$/.test(jan)
            ) {

              scanning = false;

              currentJAN = jan;


              resultBox.textContent =
                "読み取り成功： " + jan;


              resultBox.classList.remove(
                "hidden"
              );


              copyButton.classList.remove(
                "hidden"
              );


              message.textContent =
                "JANコードを読み取りました。";


              /*
               * カメラ停止
               */
              if (controls) {

                controls.stop();

                controls = null;

              }


              if (codeReader) {

                try {
                  codeReader.reset();
                } catch (e) {}

              }

            }

          }

        }

      );


    message.textContent =
      "JANコードを緑の枠に合わせてください。";


  } catch (error) {

    console.error(error);


    scanning = false;


    message.textContent =
      "カメラ起動エラー：" +
      (
        error && error.message
          ? error.message
          : error
      );


    startButton.classList.remove(
      "hidden"
    );

    stopButton.classList.add(
      "hidden"
    );

  }

}


/*
 * JANコードをコピー
 */
async function copyJAN() {

  if (!currentJAN) {

    return;

  }


  try {

    await navigator.clipboard.writeText(
      currentJAN
    );


    document
      .getElementById("message")
      .textContent =
        "JANコードをコピーしました。ゲーム管理のJAN欄に貼り付けてください。";


  } catch (error) {

    /*
     * コピー機能の予備処理
     */
    const textarea =
      document.createElement("textarea");


    textarea.value =
      currentJAN;


    textarea.style.position =
      "fixed";

    textarea.style.left =
      "-9999px";


    document.body.appendChild(
      textarea
    );


    textarea.focus();

    textarea.select();


    document.execCommand(
      "copy"
    );


    document.body.removeChild(
      textarea
    );


    document
      .getElementById("message")
      .textContent =
        "JANコードをコピーしました。ゲーム管理のJAN欄に貼り付けてください。";

  }

}


/*
 * カメラ停止
 */
function stopScanner() {

  scanning = false;


  if (controls) {

    try {
      controls.stop();
    } catch (e) {}

    controls = null;

  }


  if (codeReader) {

    try {
      codeReader.reset();
    } catch (e) {}

    codeReader = null;

  }


  const video =
    document.getElementById("video");


  if (
    video &&
    video.srcObject
  ) {

    video.srcObject
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    video.srcObject = null;

  }


  document
    .getElementById("cameraArea")
    .classList.add("hidden");


  document
    .getElementById("stopButton")
    .classList.add("hidden");


  document
    .getElementById("startButton")
    .classList.remove("hidden");


  document
    getElementById("message")
    .textContent =
      "「カメラを起動」を押してください。";

}


/*
 * ゲーム管理画面へ戻る
 */
function goBackToGameManager() {

  window.location.href =
    "https://script.google.com/macros/s/AKfycbzR1DLFRioq4Sh9sBRRPqOSNaPkVRuofzY4H9r9uxnLV4P_B_tw9wctWRoT-DlGWKMr6w/exec";

}

</script>

</body>
</html>
